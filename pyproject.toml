[project]
name = "edge-dispatch"
version = "0.1.0"
description = "Hybrid LLM Orchestration for Local-First AI Workflows — multi-agent system with conditional handoff between local (llama.cpp) and cloud (OpenAI) models"
authors = [{ name = "EdgeDispatch Team" }]
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.17",
    "openai>=2.0",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=3.0",
    "arize-phoenix>=17.0",
    "openinference-instrumentation-openai>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
