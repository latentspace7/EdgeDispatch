[project]
name = "edge-dispatch"
version = "1.0.0"
description = "EdgeDispatch local-first agent system with MCP tools and cloud escalation"
readme = "README.md"
authors = [{ name = "Dolwin Fernandes" }]
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.17.6,<0.23",
    "openai>=2.43,<3",
    "mcp>=1.28,<2",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "fastapi>=0.137,<1",
    "uvicorn[standard]>=0.49,<1",
    "sse-starlette>=3.4,<4",
    "redis>=8.1,<9",
    "httpx>=0.28,<1",
    "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3.1,<3",
    "ruff>=0.16,<0.17",
]
quality = [
    "arize-phoenix-client>=3.4,<4",
    "arize-phoenix-evals>=3.5,<4",
    "opentelemetry-api>=1.45,<2",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.37,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["server", "mcp_server_db", "mcp_server_crm", "mcp_server_wiki", "mock_airline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"server/main.py" = ["BLE001"]
"server/agent/coordination.py" = ["BLE001"]
"server/agent/discovery.py" = ["BLE001"]
"server/agent/executor.py" = ["BLE001"]
"server/agent/runtime.py" = ["BLE001"]
"server/quality/service.py" = ["BLE001"]

[tool.mypy]
files = ["server/agent/decision.py"]
python_version = "3.12"
strict = true
follow_imports = "silent"
