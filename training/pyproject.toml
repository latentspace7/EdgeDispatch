[project]
name = "edgedispatch-training"
version = "1.0.0"
description = "Reproduction of the final EdgeDispatch execution-decision LoRA"
requires-python = ">=3.12,<3.15"
dependencies = []

[project.optional-dependencies]
gpu = [
  "peft>=0.18,<1",
  "safetensors>=0.7,<1",
  "torch>=2.11,<3",
  "transformers>=5.16,<6",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"train.py" = ["E402"]
